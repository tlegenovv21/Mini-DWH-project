version: 2

models:
  - name: dm_sales_daily
    columns:
      - name: date
        tests:
          - unique
          - not_null
      - name: total_revenue
        tests:
          - not_null

  - name: dm_sales_by_category
    columns:
      - name: category
        tests:
          - unique
          - not_null

  - name: dm_customers_orders
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
